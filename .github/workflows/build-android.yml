name: Build APK Android

on:
  push:
    branches: [main]
  workflow_dispatch: # permite rodar manualmente pelo GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Adicionar plataforma Android (se necessário)
        run: npx cap add android || true

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Tornar gradlew executável
        run: chmod +x android/gradlew

      - name: Build APK debug
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Upload APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: may-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
