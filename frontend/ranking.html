<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arena de Vendas — May</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold:    #F59E0B;
      --silver:  #94A3B8;
      --bronze:  #B45309;
      --brand:   #7C3AED;
      --green:   #10B981;
      --red:     #EF4444;
      --radius:  14px;
    }

    html, body {
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      background: #080B1A;
      color: #E8E4FF;
      overflow-x: hidden;
    }
    h1,h2,h3 { font-family: 'Syne', sans-serif; }

    /* ── Canvas de partículas ─────────────────────────────── */
    #canvas-bg {
      position: fixed; inset: 0; z-index: 0;
      pointer-events: none;
    }

    /* ── Layout ───────────────────────────────────────────── */
    .page {
      position: relative; z-index: 1;
      max-width: 980px; margin: 0 auto;
      padding: 24px 16px 100px;
    }

    /* ── Header ───────────────────────────────────────────── */
    .header {
      display: flex; align-items: center; gap: 16px;
      margin-bottom: 36px; flex-wrap: wrap;
    }
    .header-back {
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 10px; padding: 8px 14px;
      font-size: 14px; font-weight: 600; color: #C4B5FD;
      text-decoration: none; cursor: pointer;
      display: flex; align-items: center; gap: 6px;
      backdrop-filter: blur(8px);
      transition: background .2s;
    }
    .header-back:hover { background: rgba(124,58,237,.25); }
    .header-title { flex: 1; }
    .header-title h1 { font-size: 28px; font-weight: 800; letter-spacing: -.02em;
      background: linear-gradient(135deg, #fff 30%, #A78BFA);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .header-title p  { font-size: 13px; color: rgba(200,190,255,.5); margin-top: 3px; }
    .periodo-tabs {
      display: flex; gap: 4px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 10px; padding: 4px;
    }
    .periodo-tab {
      padding: 6px 18px; border-radius: 8px; border: none;
      background: none; font-size: 13px; font-weight: 600;
      cursor: pointer; color: rgba(200,190,255,.5);
      transition: all .2s;
    }
    .periodo-tab.active {
      background: linear-gradient(135deg, #7C3AED, #A78BFA);
      color: #fff; box-shadow: 0 2px 12px rgba(124,58,237,.4);
    }

    /* ── Trial Banner ─────────────────────────────────────── */
    .trial-banner {
      background: linear-gradient(135deg, rgba(124,58,237,.3), rgba(167,139,250,.15));
      border: 1px solid rgba(167,139,250,.3);
      border-radius: var(--radius); padding: 16px 20px;
      display: flex; align-items: center; gap: 14px;
      margin-bottom: 28px; backdrop-filter: blur(8px);
    }
    .trial-banner .trial-icon { font-size: 28px; }
    .trial-banner h3 { font-size: 15px; font-weight: 700; color: #fff; }
    .trial-banner p  { font-size: 12px; color: rgba(200,190,255,.6); margin-top: 2px; }
    .trial-cta {
      margin-left: auto; background: linear-gradient(135deg, #7C3AED, #A78BFA);
      color: #fff; border: none; border-radius: 8px;
      padding: 8px 18px; font-weight: 700; font-size: 13px; cursor: pointer;
      white-space: nowrap; box-shadow: 0 4px 14px rgba(124,58,237,.5);
    }

    /* ── Stats Bar ────────────────────────────────────────── */
    .stats-bar {
      display: grid; grid-template-columns: repeat(4,1fr); gap: 12px;
      margin-bottom: 32px;
    }
    @media(max-width:600px){ .stats-bar { grid-template-columns: 1fr 1fr; } }
    .stat-card {
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: var(--radius); padding: 18px 16px; text-align: center;
      backdrop-filter: blur(8px);
      transition: border-color .25s, transform .25s;
    }
    .stat-card:hover { border-color: rgba(167,139,250,.4); transform: translateY(-2px); }
    .stat-val {
      font-family: 'Syne',sans-serif; font-size: 22px; font-weight: 800;
      background: linear-gradient(135deg,#A78BFA,#60A5FA);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .stat-lbl {
      font-size: 10px; color: rgba(200,190,255,.45); margin-top: 4px;
      text-transform: uppercase; letter-spacing: .06em;
    }

    /* ── Podium ───────────────────────────────────────────── */
    .podium-section {
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 20px; padding: 32px 24px 24px;
      margin-bottom: 28px; backdrop-filter: blur(8px);
      position: relative; overflow: hidden;
    }
    .podium-section::before {
      content: ''; position: absolute; top: -60px; left: 50%; transform: translateX(-50%);
      width: 400px; height: 200px;
      background: radial-gradient(ellipse, rgba(124,58,237,.18) 0%, transparent 70%);
      pointer-events: none;
    }
    .podium-wrap {
      display: flex; justify-content: center; align-items: flex-end;
      gap: 16px; padding: 0 8px;
    }
    .podium-item {
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      flex: 1; max-width: 200px;
    }
    .podium-crown { font-size: 22px; height: 28px; display: flex; align-items: center; justify-content: center; }
    .podium-avatar {
      border-radius: 50%; object-fit: cover;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; font-weight: 800; color: #fff;
      border: 3px solid rgba(255,255,255,.15);
      box-shadow: 0 0 0 0 transparent;
      transition: box-shadow .3s;
    }
    .podium-avatar.gold   { border-color: var(--gold);   box-shadow: 0 0 20px rgba(245,158,11,.4); }
    .podium-avatar.silver { border-color: var(--silver); box-shadow: 0 0 16px rgba(148,163,184,.3); }
    .podium-avatar.bronze { border-color: #CD7F32;       box-shadow: 0 0 14px rgba(205,127,50,.3); }
    .podium-name  { font-size: 13px; font-weight: 700; text-align: center; color: #fff; }
    .podium-count { font-size: 11px; color: rgba(200,190,255,.5); }
    .podium-block {
      width: 100%; border-radius: 12px 12px 0 0;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Syne',sans-serif; font-size: 28px; font-weight: 800;
    }
    .podium-block.gold   { height: 96px; background: linear-gradient(180deg,rgba(245,158,11,.3),rgba(245,158,11,.08)); color: var(--gold); border-top: 2px solid rgba(245,158,11,.5); }
    .podium-block.silver { height: 68px; background: linear-gradient(180deg,rgba(148,163,184,.2),rgba(148,163,184,.04)); color: var(--silver); border-top: 2px solid rgba(148,163,184,.4); }
    .podium-block.bronze { height: 52px; background: linear-gradient(180deg,rgba(205,127,50,.2),rgba(205,127,50,.04)); color: #CD7F32; border-top: 2px solid rgba(205,127,50,.4); }

    /* ── Tabs ─────────────────────────────────────────────── */
    .tabs {
      display: flex; gap: 0; margin-bottom: 20px;
      border-bottom: 1px solid rgba(255,255,255,.1);
    }
    .tab-btn {
      background: none; border: none; font-size: 14px; font-weight: 600;
      color: rgba(200,190,255,.45); padding: 10px 20px 12px; cursor: pointer;
      border-bottom: 2px solid transparent; margin-bottom: -1px;
      transition: color .2s, border-color .2s;
    }
    .tab-btn.active { color: #A78BFA; border-bottom-color: #7C3AED; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* ── Leaderboard ──────────────────────────────────────── */
    .leaderboard {
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: var(--radius); overflow: hidden;
      margin-bottom: 28px; backdrop-filter: blur(8px);
    }
    .lb-row {
      display: grid;
      grid-template-columns: 40px 1fr 80px 90px 80px 70px;
      align-items: center; padding: 14px 16px;
      border-bottom: 1px solid rgba(255,255,255,.05);
      transition: background .15s;
    }
    .lb-row:last-child { border-bottom: none; }
    .lb-row:not(.header-row):hover { background: rgba(167,139,250,.07); }
    .lb-row.header-row {
      background: rgba(255,255,255,.03); font-size: 10px; font-weight: 600;
      color: rgba(200,190,255,.35); text-transform: uppercase;
      letter-spacing: .06em; padding: 10px 16px;
    }
    .lb-row.highlight { background: rgba(124,58,237,.12) !important; }
    @media(max-width:600px){
      .lb-row { grid-template-columns: 32px 1fr 60px 70px; }
      .lb-row .col-tempo, .lb-row .col-xp { display: none; }
    }
    .lb-pos { font-family: 'Syne',sans-serif; font-weight: 800; font-size: 16px; color: rgba(200,190,255,.3); }
    .lb-pos.p1 { color: var(--gold); text-shadow: 0 0 12px rgba(245,158,11,.6); }
    .lb-pos.p2 { color: var(--silver); }
    .lb-pos.p3 { color: #CD7F32; }
    .lb-user { display: flex; align-items: center; gap: 10px; }
    .lb-av {
      width: 34px; height: 34px; border-radius: 50%;
      background: rgba(124,58,237,.3);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 12px; color: #A78BFA; flex-shrink: 0;
      border: 1px solid rgba(124,58,237,.4);
    }
    .lb-name { font-size: 14px; font-weight: 600; color: #fff; }
    .lb-sub  { font-size: 11px; color: rgba(200,190,255,.4); }
    .lb-val  { font-size: 14px; font-weight: 700; text-align: right; color: rgba(200,190,255,.7); }
    .lb-val.green { color: var(--green); }
    .badge-streak {
      display: inline-flex; align-items: center; gap: 3px;
      background: rgba(245,158,11,.15); color: var(--gold);
      font-size: 10px; font-weight: 700; padding: 2px 7px;
      border-radius: 20px; margin-top: 2px;
    }
    .section-title {
      font-size: 12px; font-weight: 700; color: rgba(200,190,255,.4);
      text-transform: uppercase; letter-spacing: .08em; margin-bottom: 12px;
    }

    /* ── Gestor ───────────────────────────────────────────── */
    .alert-box {
      border-radius: 10px; padding: 12px 16px; font-size: 13px;
      margin-bottom: 10px; display: flex; align-items: flex-start; gap: 10px;
      backdrop-filter: blur(8px);
    }
    .alert-box.atencao  { background: rgba(239,68,68,.1);  color: #FCA5A5; border: 1px solid rgba(239,68,68,.2); }
    .alert-box.aviso    { background: rgba(245,158,11,.1); color: #FDE68A; border: 1px solid rgba(245,158,11,.2); }
    .alert-box.destaque { background: rgba(16,185,129,.1); color: #6EE7B7; border: 1px solid rgba(16,185,129,.2); }
    .alert-icon { font-size: 18px; flex-shrink: 0; margin-top: -1px; }
    .colab-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 20px; }
    @media(max-width:620px){ .colab-grid { grid-template-columns: 1fr; } }
    .colab-card {
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: var(--radius); padding: 16px;
      backdrop-filter: blur(8px);
      transition: border-color .2s, transform .2s;
    }
    .colab-card:hover { transform: translateY(-2px); border-color: rgba(167,139,250,.2); }
    .colab-card.status-queda    { border-left: 3px solid var(--red); }
    .colab-card.status-destaque { border-left: 3px solid var(--green); }
    .colab-card.status-atencao  { border-left: 3px solid var(--gold); }
    .colab-card.status-ok       { border-left: 3px solid rgba(255,255,255,.1); }
    .colab-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .colab-av {
      width: 36px; height: 36px; border-radius: 50%;
      background: rgba(124,58,237,.3);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 13px; color: #A78BFA; flex-shrink: 0;
      border: 1px solid rgba(124,58,237,.4);
    }
    .colab-name { font-size: 14px; font-weight: 700; color: #fff; }
    .colab-stats { font-size: 12px; color: rgba(200,190,255,.5); }
    .colab-insights { font-size: 12px; color: rgba(200,190,255,.5); margin-top: 8px; }
    .colab-insights li { list-style: disc; margin-left: 16px; margin-top: 3px; }
    .treinar-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .treinar-tag {
      background: rgba(124,58,237,.2); color: #C4B5FD;
      font-size: 11px; font-weight: 600; padding: 4px 10px;
      border-radius: 20px; border: 1px solid rgba(124,58,237,.3);
    }

    /* ── Minha Semana ─────────────────────────────────────── */
    .semana-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; margin-bottom: 20px; }
    @media(max-width:500px){ .semana-grid { grid-template-columns: 1fr 1fr; } }
    .semana-card {
      background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08);
      border-radius: var(--radius); padding: 18px; text-align: center;
      backdrop-filter: blur(8px);
    }
    .semana-val {
      font-family: 'Syne',sans-serif; font-size: 26px; font-weight: 800;
      background: linear-gradient(135deg,#A78BFA,#60A5FA);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .semana-var { font-size: 12px; font-weight: 600; margin-top: 2px; }
    .semana-var.up   { color: var(--green); }
    .semana-var.down { color: var(--red); }
    .semana-lbl { font-size: 10px; color: rgba(200,190,255,.4); margin-top: 4px; text-transform: uppercase; letter-spacing: .06em; }
    .insight-box {
      background: rgba(124,58,237,.15); border: 1px solid rgba(124,58,237,.3);
      border-radius: var(--radius); padding: 16px 20px; margin-bottom: 20px;
      font-size: 14px; color: #C4B5FD; line-height: 1.6;
    }
    .posicao-destaque {
      display: flex; align-items: center; gap: 12px;
      background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08);
      border-radius: var(--radius); padding: 16px 20px; margin-bottom: 20px;
    }
    .posicao-num {
      font-family: 'Syne',sans-serif; font-size: 40px; font-weight: 800;
      background: linear-gradient(135deg, var(--gold), #FDE68A);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .posicao-txt { font-size: 13px; color: rgba(200,190,255,.5); }
    .ultimas-vendas {
      background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08);
      border-radius: var(--radius); overflow: hidden; backdrop-filter: blur(8px);
    }
    .uv-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 13px 16px; border-bottom: 1px solid rgba(255,255,255,.05);
      font-size: 13px; transition: background .15s;
    }
    .uv-row:hover { background: rgba(167,139,250,.06); }
    .uv-row:last-child { border-bottom: none; }
    .uv-desc { font-weight: 600; color: #fff; }
    .uv-meta { font-size: 11px; color: rgba(200,190,255,.4); margin-top: 1px; }
    .uv-val  { font-weight: 700; color: var(--green); }
    .uv-val.exito { color: rgba(200,190,255,.4); font-style: italic; font-weight: 400; }

    /* ── Metas ────────────────────────────────────────────── */
    .metas-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 28px; }
    @media(max-width:620px){ .metas-grid { grid-template-columns: 1fr; } }

    .meta-card {
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 16px; padding: 20px;
      backdrop-filter: blur(8px);
      transition: border-color .2s, transform .2s;
      position: relative; overflow: hidden;
    }
    .meta-card:hover { transform: translateY(-2px); border-color: rgba(167,139,250,.25); }
    .meta-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, #7C3AED, #60A5FA);
      border-radius: 16px 16px 0 0;
    }
    .meta-card.nivel-1::before { background: linear-gradient(90deg,#CD7F32,#F59E0B); }
    .meta-card.nivel-2::before { background: linear-gradient(90deg,#94A3B8,#E2E8F0); }
    .meta-card.nivel-3::before { background: linear-gradient(90deg,#F59E0B,#FDE68A); }

    .meta-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; }
    .meta-titulo { font-size: 15px; font-weight: 700; color: #fff; }
    .meta-periodo-badge {
      font-size: 10px; font-weight: 700; padding: 3px 9px; border-radius: 20px;
      background: rgba(124,58,237,.25); color: #C4B5FD;
      border: 1px solid rgba(124,58,237,.3); text-transform: uppercase; letter-spacing: .06em;
      white-space: nowrap;
    }
    .meta-indicador { font-size: 11px; color: rgba(200,190,255,.4); margin-bottom: 16px; }

    /* Barra de progresso com 3 marcos */
    .meta-progress-wrap { position: relative; margin-bottom: 20px; }
    .meta-bar-bg {
      height: 10px; background: rgba(255,255,255,.08); border-radius: 10px;
      overflow: visible; position: relative;
    }
    .meta-bar-fill {
      height: 100%; border-radius: 10px; transition: width 1s cubic-bezier(.4,0,.2,1);
      background: linear-gradient(90deg,#7C3AED,#A78BFA);
      position: relative;
    }
    .meta-bar-fill.nivel-1 { background: linear-gradient(90deg,#92400E,#F59E0B); }
    .meta-bar-fill.nivel-2 { background: linear-gradient(90deg,#64748B,#E2E8F0); }
    .meta-bar-fill.nivel-3 { background: linear-gradient(90deg,#B45309,#FDE68A); }

    .meta-marker {
      position: absolute; top: 50%; transform: translate(-50%,-50%);
      width: 16px; height: 16px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,.15); background: #0f0d1a;
      display: flex; align-items: center; justify-content: center;
      font-size: 8px; z-index: 2;
      transition: border-color .3s, box-shadow .3s;
    }
    .meta-marker.atingida { border-color: var(--green); box-shadow: 0 0 8px rgba(16,185,129,.5); }
    .meta-marker.m1 { }
    .meta-marker.m2 { }
    .meta-marker.m3 { }

    .meta-labels { display: flex; justify-content: space-between; margin-top: 10px; }
    .meta-label {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      font-size: 10px; flex: 1;
    }
    .meta-label .lbl-icon { font-size: 14px; }
    .meta-label .lbl-val  { font-weight: 700; color: rgba(200,190,255,.8); }
    .meta-label .lbl-txt  { color: rgba(200,190,255,.35); font-size: 9px; text-transform: uppercase; letter-spacing: .04em; }
    .meta-label.atingida .lbl-val { color: var(--green); }

    .meta-atual-row {
      display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px;
    }
    .meta-atual-num {
      font-family: 'Syne',sans-serif; font-size: 28px; font-weight: 800;
      background: linear-gradient(135deg,#A78BFA,#60A5FA);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .meta-atual-unit { font-size: 13px; color: rgba(200,190,255,.4); }
    .meta-nivel-badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700;
      margin-top: 4px;
    }
    .meta-nivel-badge.n0 { background: rgba(239,68,68,.15);   color: #FCA5A5; border: 1px solid rgba(239,68,68,.2); }
    .meta-nivel-badge.n1 { background: rgba(180,83,9,.2);     color: #FCD9BD; border: 1px solid rgba(180,83,9,.3); }
    .meta-nivel-badge.n2 { background: rgba(148,163,184,.15); color: #E2E8F0; border: 1px solid rgba(148,163,184,.2); }
    .meta-nivel-badge.n3 { background: rgba(245,158,11,.15);  color: #FDE68A; border: 1px solid rgba(245,158,11,.25); }

    /* Equipe no card da meta (gestor) */
    .meta-team-row {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 0; border-top: 1px solid rgba(255,255,255,.05);
    }
    .meta-team-av {
      width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
      background: rgba(124,58,237,.25); display: flex; align-items: center;
      justify-content: center; font-size: 10px; font-weight: 700; color: #A78BFA;
    }
    .meta-team-name { font-size: 12px; color: rgba(200,190,255,.7); flex: 1; }
    .meta-team-bar-bg {
      flex: 2; height: 6px; background: rgba(255,255,255,.06);
      border-radius: 6px; overflow: hidden;
    }
    .meta-team-bar-fill {
      height: 100%; border-radius: 6px;
      background: linear-gradient(90deg,#7C3AED,#A78BFA);
      transition: width 1s ease;
    }
    .meta-team-bar-fill.n1 { background: linear-gradient(90deg,#92400E,#F59E0B); }
    .meta-team-bar-fill.n2 { background: linear-gradient(90deg,#64748B,#E2E8F0); }
    .meta-team-bar-fill.n3 { background: linear-gradient(90deg,#B45309,#FDE68A); }
    .meta-team-val { font-size: 11px; font-weight: 700; color: rgba(200,190,255,.6); white-space: nowrap; }

    /* Modal nova meta */
    .meta-modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.75); z-index: 100;

<body>

<!-- Canvas de partículas -->
<canvas id="canvas-bg"></canvas>

<div class="page" id="page">

  <div class="header">

<!-- Modal Nova/Editar Meta -->
<div class="meta-modal-overlay" id="meta-modal">

      </div>

<script>
// ── Partículas ─────────────────────────────────────────────────────────────────
(function() {
  const canvas = document.getElementById('canvas-bg');
  const ctx    = canvas.getContext('2d');
  let particles = [];
  let W, H;

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  const COLORS = ['#7C3AED','#A78BFA','#60A5FA','#F59E0B','#fff'];

  function Particle() {
    this.reset = function() {
      this.x    = Math.random() * W;
      this.y    = Math.random() * H;
      this.r    = Math.random() * 1.6 + .3;
      this.vx   = (Math.random() - .5) * .35;
      this.vy   = (Math.random() - .5) * .35;
      this.a    = Math.random();
      this.da   = (Math.random() * .4 + .2) * (Math.random() > .5 ? 1 : -1) * .008;
      this.col  = COLORS[Math.floor(Math.random() * COLORS.length)];
      this.twinkle = Math.random() > .65;  // some particles twinkle
    };
    this.reset();
  }

  for (let i = 0; i < 160; i++) { const p = new Particle(); particles.push(p); }

  // Add "shooting star" occasionally
  let stars = [];
  function addStar() {
    stars.push({ x: Math.random() * W, y: Math.random() * H * .5,
      vx: (Math.random() * 3 + 2), vy: (Math.random() * 1.5 + .5),
      life: 1, len: Math.random() * 80 + 40 });
  }
  setInterval(addStar, 3200);

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // Background gradient
    const grad = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W,H)*.7);
    grad.addColorStop(0,   'rgba(14,10,35,.98)');
    grad.addColorStop(.5,  'rgba(8,11,26,.99)');
    grad.addColorStop(1,   'rgba(4,6,18,1)');
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,W,H);

    // Particles
    particles.forEach(p => {
      p.x += p.vx; p.y += p.vy;
      if (p.x < -5) p.x = W+5;
      if (p.x > W+5) p.x = -5;
      if (p.y < -5) p.y = H+5;
      if (p.y > H+5) p.y = -5;
      p.a += p.da;
      if (p.a > 1 || p.a < 0) p.da *= -1;

      ctx.save();
      ctx.globalAlpha = Math.max(0, p.a);

      if (p.twinkle) {
        // 4-pointed star shape
        const s = p.r * 2.5;
        ctx.fillStyle = p.col;
        ctx.shadowColor = p.col;
        ctx.shadowBlur  = 6;
        ctx.beginPath();
        ctx.moveTo(p.x, p.y - s);
        ctx.lineTo(p.x + s*.25, p.y - s*.25);
        ctx.lineTo(p.x + s, p.y);
        ctx.lineTo(p.x + s*.25, p.y + s*.25);
        ctx.lineTo(p.x, p.y + s);
        ctx.lineTo(p.x - s*.25, p.y + s*.25);
        ctx.lineTo(p.x - s, p.y);
        ctx.lineTo(p.x - s*.25, p.y - s*.25);
        ctx.closePath();
        ctx.fill();
      } else {
        ctx.fillStyle = p.col;
        ctx.shadowColor = p.col;
        ctx.shadowBlur  = p.r * 3;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
        ctx.fill();
      }
      ctx.restore();
    });

    // Shooting stars
    stars = stars.filter(s => s.life > 0);
    stars.forEach(s => {
      ctx.save();
      ctx.globalAlpha = s.life * .7;
      const grad2 = ctx.createLinearGradient(s.x - s.len, s.y - s.len*.4, s.x, s.y);
      grad2.addColorStop(0, 'transparent');
      grad2.addColorStop(1, '#fff');
      ctx.strokeStyle = grad2;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(s.x - s.len, s.y - s.len*.4);
      ctx.lineTo(s.x, s.y);
      ctx.stroke();
      ctx.restore();
      s.x += s.vx; s.y += s.vy; s.life -= .015;
    });

    requestAnimationFrame(draw);
  }
  draw();
})();

// ── Config ─────────────────────────────────────────────────────────────────────
const API = window.location.hostname === 'localhost' ? 'http://localhost:3000' : '';
let periodoAtual      = 'mes';
let dadosRanking      = null;
let dadosDash         = null;
let dadosSemana       = null;
let dadosMinhasVendas = null;
let dadosTodasVendas  = null;
let dadosMetas        = null;
let dadosMetasGestor  = null;
let userRole          = null;
let userId            = null;
let membrosCache      = [];

// ── Auth ───────────────────────────────────────────────────────────────────────
function getToken() { return localStorage.getItem('may_access'); }
async function apiFetch(path, opts = {}) {
  const token = getToken();
  return fetch(API + path, {
    ...opts,
    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json', ...(opts.headers||{}) },
  });
}

// ── Utils ──────────────────────────────────────────────────────────────────────
function fmtBRL(v) {
  if (!v && v !== 0) return '—';
  return 'R$ ' + Number(v).toLocaleString('pt-BR', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
}
function inicial(name) { return (name||'?').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase(); }
function avatarHtml(name, url, cls='', size=60) {
  const style = `width:${size}px;height:${size}px;`;
  if (url) return `<img src="${url}" alt="${name}" class="podium-avatar ${cls}" style="${style}object-fit:cover;" />`;
  return `<div class="podium-avatar ${cls}" style="${style}background:rgba(124,58,237,.25);">${inicial(name)}</div>`;
}

// ── Init ───────────────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', async () => {
  const token = getToken();
  if (!token) { window.location.href = 'index.html'; return; }
  try {
    const r = await apiFetch('/api/user/me');
    if (!r.ok) throw new Error();
    const me = await r.json();
    userRole = me.role; userId = me.id;
  } catch { window.location.href = 'index.html'; return; }
  await carregarDados();
});

async function setPeriodo(p) {
  periodoAtual = p;
  document.querySelectorAll('.periodo-tab').forEach((b,i) =>
    b.classList.toggle('active', (i===0&&p==='mes')||(i===1&&p==='semana')));
  await carregarDados();
}

async function carregarDados() {
  document.getElementById('main-content').innerHTML = '<div class="loading">Carregando ranking</div>';
  try {
    const r    = await apiFetch(`/api/ranking/leaderboard?periodo=${periodoAtual}`);
    const data = await r.json();
    if (!data.acesso?.acesso) { mostrarBloqueado(data.acesso); return; }

    dadosRanking = data;
    handleTrialBanner(data.acesso);
    document.getElementById('header-sub').textContent =
      `${periodoAtual === 'mes' ? 'Ranking do mês' : 'Ranking da semana'} · ${data.ranking?.length||0} participantes`;

    const promises = [
      apiFetch('/api/ranking/minha-semana'),
      apiFetch('/api/vendas/meu-resumo'),
      apiFetch('/api/metas'),
    ];
    if (userRole === 'gestor') {
      promises.push(apiFetch('/api/ranking/dashboard'));
      promises.push(apiFetch('/api/vendas/todas'));
      promises.push(apiFetch('/api/metas/gestor'));
    }
    const results  = await Promise.all(promises);
    dadosSemana       = await results[0].json();
    dadosMinhasVendas = await results[1].json();
    dadosMetas        = await results[2].json();
    if (userRole === 'gestor' && results[3]) dadosDash        = await results[3].json();
    if (userRole === 'gestor' && results[4]) dadosTodasVendas = await results[4].json();
    if (userRole === 'gestor' && results[5]) {
      dadosMetasGestor = await results[5].json();
      membrosCache     = dadosMetasGestor.membros || [];
    }

    renderizarPagina();
  } catch(e) {
    console.error(e);
    document.getElementById('main-content').innerHTML =
      '<div class="empty-state"><div class="empty-icon">⚠️</div><p>Erro ao carregar ranking.</p></div>';
  }
}

function handleTrialBanner(acesso) {
  const b = document.getElementById('trial-banner');
  if (acesso?.trial) {
    b.style.display = 'flex';
    document.getElementById('trial-dias-txt').textContent =
      `Restam ${acesso.dias_restantes} dia${acesso.dias_restantes!==1?'s':''} de acesso gratuito`;
  } else { b.style.display = 'none'; }
}

function mostrarBloqueado(acesso) {
  document.getElementById('trial-banner').style.display = 'none';
  document.getElementById('main-content').innerHTML = `
    <div class="acesso-bloqueado">
      <div class="lock-icon">🔒</div>
      <h2>Arena de Vendas</h2>
      <p>${acesso?.motivo === 'trial_expirado'
        ? 'Seu período de teste encerrou. Ative o plano para continuar acompanhando o ranking da sua equipe.'
        : 'Ative o ranking e transforme as vendas da sua equipe em uma competição saudável e motivadora.'}</p>
      <button class="btn-activar" onclick="alert('Entre em contato com a May para ativar!')">
        ${acesso?.motivo === 'trial_expirado' ? '🚀 Ativar Plano Completo' : '⚡ Testar Grátis por 7 dias'}
      </button>
    </div>`;
}

// ── Render ─────────────────────────────────────────────────────────────────────
function renderizarPagina() {
  const ranking = dadosRanking?.ranking || [];
  const stats   = dadosRanking?.stats_time || {};
  const temGestor = userRole === 'gestor' && dadosDash;

  const tabs = temGestor
    ? `<div class="tabs">
        <button class="tab-btn active" onclick="trocarTab('ranking',this)">🏆 Ranking</button>
        <button class="tab-btn"        onclick="trocarTab('gestor',this)">📊 Painel Gestor</button>
        <button class="tab-btn"        onclick="trocarTab('metas',this)">🎯 Metas</button>
        <button class="tab-btn"        onclick="trocarTab('semana',this)">📅 Minha Semana</button>
       </div>`
    : `<div class="tabs">
        <button class="tab-btn active" onclick="trocarTab('ranking',this)">🏆 Ranking</button>
        <button class="tab-btn"        onclick="trocarTab('metas',this)">🎯 Metas</button>
        <button class="tab-btn"        onclick="trocarTab('semana',this)">📅 Minha Semana</button>
       </div>`;

  document.getElementById('main-content').innerHTML = `
    <div class="stats-bar">
      <div class="stat-card"><div class="stat-val">${stats.total_contratos||0}</div><div class="stat-lbl">Contratos</div></div>
      <div class="stat-card"><div class="stat-val">${fmtBRL(stats.total_faturado)}</div><div class="stat-lbl">Faturamento</div></div>
      <div class="stat-card"><div class="stat-val">${stats.tempo_medio_fechamento!=null?stats.tempo_medio_fechamento+'d':'—'}</div><div class="stat-lbl">Tempo Médio</div></div>
      <div class="stat-card"><div class="stat-val">${stats.melhor_origem||'—'}</div><div class="stat-lbl">Melhor Origem</div></div>
    </div>
    ${tabs}
    <div class="tab-panel active" id="tab-ranking">
      ${renderPodium(ranking)}
      <p class="section-title" style="margin-top:24px">Todos os participantes</p>
      ${renderLeaderboard(ranking)}
    </div>
    ${temGestor ? `<div class="tab-panel" id="tab-gestor">${renderGestor()}</div>` : ''}
    <div class="tab-panel" id="tab-metas">${renderMetas()}</div>
    <div class="tab-panel" id="tab-semana">${renderSemana()}</div>`;
}

function trocarTab(nome, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  const panel = document.getElementById('tab-' + nome);
  if (panel) panel.classList.add('active');
}

// ── Tabela de Clientes ─────────────────────────────────────────────────────────
const ORIGENS_LABEL = {
  indicacao:'Indicação', instagram:'Instagram', trafego_meta:'Meta Ads',
  trafego_google:'Google Ads', grupo_whatsapp:'WhatsApp', parceria:'Parceria',
  tiktok:'TikTok', outro:'Outro',
};

function renderTabelaVendas(vendas, mostrarVendedor = false) {
  if (!vendas?.length) return `<div class="empty-state" style="padding:32px"><div class="empty-icon" style="font-size:32px">📋</div><p>Nenhuma venda registrada este mês.</p></div>`;

  const linhas = vendas.map(v => {
    const nome  = v.users?.name || '';
    const avUrl = v.users?.avatar_url || '';
    const tel   = v.telefone ? `<a href="tel:${v.telefone}">${v.telefone}</a>` : '<span style="color:rgba(200,190,255,.25)">—</span>';
    const orig  = v.origem ? `<span class="td-origem-badge">${ORIGENS_LABEL[v.origem]||v.origem}</span>` : '—';
    const val   = v.valor
      ? `<span class="td-valor">${fmtBRL(parseFloat(v.valor))}</span>`
      : `<span class="td-valor exito">Êxito</span>`;
    const dtC   = v.data_contato    ? v.data_contato.slice(0,10).split('-').reverse().join('/')    : '—';
    const dtF   = v.data_fechamento ? v.data_fechamento.slice(0,10).split('-').reverse().join('/') : '—';
    const vdCol = mostrarVendedor ? `<td><div class="td-vendedor">
        ${avUrl
          ? `<img src="${avUrl}" class="td-vd-av" style="object-fit:cover" />`
          : `<div class="td-vd-av">${inicial(nome)}</div>`}
        <span>${nome.split(' ')[0]}</span>
      </div></td>` : '';

    return `<tr>
      ${vdCol}
      <td class="td-cliente">${v.cliente||'—'}</td>
      <td class="td-tel">${tel}</td>
      <td>${v.descricao||'—'}</td>
      <td>${orig}</td>
      <td>${val}</td>
      <td class="col-hide">${dtC}</td>
      <td class="col-hide">${dtF}</td>
    </tr>`;
  }).join('');

  const thVd = mostrarVendedor ? '<th>Vendedor</th>' : '';

  return `<div class="table-wrap">
    <table class="clientes-table">
      <thead><tr>
        ${thVd}
        <th>Cliente</th>
        <th>Telefone</th>
        <th>Produto/Serviço</th>
        <th>Origem</th>
        <th>Valor</th>
        <th class="col-hide">1º Contato</th>
        <th class="col-hide">Fechamento</th>
      </tr></thead>
      <tbody>${linhas}</tbody>
    </table>
  </div>`;
}

// ── Pódio ──────────────────────────────────────────────────────────────────────
function renderPodium(ranking) {
  if (!ranking.length) return '<div class="empty-state"><div class="empty-icon">🏆</div><p>Nenhuma venda registrada ainda.</p></div>';
  const [p1, p2, p3] = ranking;
  const crowns = { gold:'👑', silver:'🥈', bronze:'🥉' };
  const makeItem = (p, cls, label) => p ? `
    <div class="podium-item">
      <div class="podium-crown">${crowns[cls]||''}</div>
      ${avatarHtml(p.name, p.avatar_url, cls, 64)}
      <div class="podium-name">${p.name.split(' ')[0]}</div>
      <div class="podium-count">${p.count_mes} contrato${p.count_mes!==1?'s':''}</div>
      <div class="podium-block ${cls}">${label}</div>
    </div>` : '';

  return `<div class="podium-section">
    <div class="podium-wrap">
      ${makeItem(p2,'silver','2')}
      ${makeItem(p1,'gold','1')}
      ${makeItem(p3,'bronze','3')}
    </div>
  </div>`;
}

// ── Leaderboard ────────────────────────────────────────────────────────────────
function renderLeaderboard(ranking) {
  if (!ranking.length) return '';
  const posClass = i => i===1?'p1':i===2?'p2':i===3?'p3':'';
  const rows = ranking.map(r => `
    <div class="lb-row${r.user_id===userId?' highlight':''}">
      <div class="lb-pos ${posClass(r.posicao)}">${r.posicao}</div>
      <div class="lb-user">
        ${r.avatar_url
          ? `<img src="${r.avatar_url}" class="lb-av" style="object-fit:cover;" alt="${r.name}" />`
          : `<div class="lb-av">${inicial(r.name)}</div>`}
        <div>
          <div class="lb-name">${r.name}${r.user_id===userId?' <span style="font-size:10px;color:#A78BFA">(você)</span>':''}</div>
          ${r.streak>0?`<span class="badge-streak">🔥 ${r.streak} dias</span>`:''}
        </div>
      </div>
      <div class="lb-val">${r.count_mes}</div>
      <div class="lb-val green">${r.total_mes>0?fmtBRL(r.total_mes):'—'}</div>
      <div class="lb-val col-tempo">${r.tempo_medio_fechamento!=null?r.tempo_medio_fechamento+' d':'—'}</div>
      <div class="lb-val col-xp">${r.xp_total} XP</div>
    </div>`).join('');

  return `<div class="leaderboard">
    <div class="lb-row header-row">
      <div>#</div><div>Vendedor</div>
      <div style="text-align:right">Contratos</div>
      <div style="text-align:right">Faturado</div>
      <div style="text-align:right" class="col-tempo">T. Médio</div>
      <div style="text-align:right" class="col-xp">XP</div>
    </div>${rows}
  </div>`;
}

// ── Gestor ─────────────────────────────────────────────────────────────────────
function renderGestor() {
  if (!dadosDash) return '<div class="empty-state"><div class="empty-icon">📊</div><p>Sem dados.</p></div>';
  const { colaboradores, alertas, origens_time } = dadosDash;
  const alertHtml = (alertas||[]).map(a => `
    <div class="alert-box ${a.tipo}">
      <span class="alert-icon">${a.tipo==='atencao'?'🚨':a.tipo==='aviso'?'⚠️':'🚀'}</span>
      <span>${a.msg}</span>
    </div>`).join('');

  const colabHtml = (colaboradores||[]).map(c => `
    <div class="colab-card status-${c.status}">
      <div class="colab-head">
        ${c.avatar_url
          ? `<img src="${c.avatar_url}" class="colab-av" style="object-fit:cover;" alt="${c.name}" />`
          : `<div class="colab-av">${inicial(c.name)}</div>`}
        <div>
          <div class="colab-name">${c.name}</div>
          <div class="colab-stats">${c.contratos_mes} contrato${c.contratos_mes!==1?'s':''} · ${c.faturamento_mes>0?fmtBRL(c.faturamento_mes):'—'}
            ${c.variacao_contratos!=null?`<span style="color:${c.variacao_contratos>=0?'var(--green)':'var(--red)'}">(${c.variacao_contratos>0?'+':''}${c.variacao_contratos}%)</span>`:''}
          </div>
        </div>
      </div>
      <ul class="colab-insights">${c.insights.map(i=>`<li>${i}</li>`).join('')}</ul>
      ${c.o_que_treinar?.length?`<div class="treinar-tags">${c.o_que_treinar.map(t=>`<span class="treinar-tag">📚 ${t}</span>`).join('')}</div>`:''}
    </div>`).join('');

  return `
    ${alertHtml}
    <p class="section-title" style="margin-top:16px">Colaboradores</p>
    <div class="colab-grid">${colabHtml||'<p style="color:rgba(200,190,255,.4);font-size:13px">Sem colaboradores.</p>'}</div>
    ${origens_time?.length?`
      <p class="section-title" style="margin-top:24px">Origem dos clientes</p>
      <div class="stats-bar" style="grid-template-columns:repeat(${Math.min(origens_time.length,4)},1fr)">
        ${origens_time.slice(0,4).map(o=>`<div class="stat-card"><div class="stat-val">${o.count}</div><div class="stat-lbl">${o.origem}</div></div>`).join('')}
      </div>`:''}
    <p class="section-title" style="margin-top:28px">Todos os clientes — mês atual</p>
    ${renderTabelaVendas(dadosTodasVendas?.vendas, true)}`
}

// ── Minha Semana ───────────────────────────────────────────────────────────────
function renderSemana() {
  if (!dadosSemana) return '<div class="empty-state"><div class="empty-icon">📅</div><p>Sem dados.</p></div>';
  const { semana, variacao, posicao_semana, o_que_treinar, insight, ultimas_vendas } = dadosSemana;
  const varC = variacao?.contratos, varF = variacao?.faturamento;
  return `
    <div class="semana-grid">
      <div class="semana-card">
        <div class="semana-val">${semana.contratos}</div>
        ${varC!=null?`<div class="semana-var ${varC>=0?'up':'down'}">${varC>0?'+':''}${varC}% vs ant.</div>`:''}
        <div class="semana-lbl">Contratos</div>
      </div>
      <div class="semana-card">
        <div class="semana-val">${semana.faturamento>0?fmtBRL(semana.faturamento):'—'}</div>
        ${varF!=null?`<div class="semana-var ${varF>=0?'up':'down'}">${varF>0?'+':''}${varF}%</div>`:''}
        <div class="semana-lbl">Faturamento</div>
      </div>
      <div class="semana-card">
        <div class="semana-val">${semana.tempo_medio_fechamento!=null?semana.tempo_medio_fechamento+'d':'—'}</div>
        <div class="semana-lbl">Tempo médio</div>
      </div>
    </div>
    ${posicao_semana?`
      <div class="posicao-destaque">
        <div class="posicao-num">#${posicao_semana}</div>
        <div>
          <div style="font-weight:700;font-size:14px;color:#fff">Sua posição esta semana</div>
          <div class="posicao-txt">no ranking da equipe</div>
        </div>
      </div>`:''}
    <div class="insight-box">💡 ${insight||''}</div>
    ${o_que_treinar?.length?`
      <p class="section-title">O que treinar esta semana</p>
      <div class="treinar-tags" style="margin-bottom:24px">
        ${o_que_treinar.map(t=>`<span class="treinar-tag" style="font-size:13px;padding:6px 16px">📚 ${t}</span>`).join('')}
      </div>`:''}
    <p class="section-title" style="margin-top:8px">Meus clientes — mês atual</p>
    ${renderTabelaVendas(dadosMinhasVendas?.vendas, false)}`;
}

// ── Metas ──────────────────────────────────────────────────────────────────────
const NIVEL_LABELS = ['Ainda não iniciada','🥉 Bronze','🥈 Prata','🥇 Ouro'];
const NIVEL_ICONS  = ['🎯','🥉','🥈','🥇'];
const PERIODO_PT   = { semanal:'Semanal', mensal:'Mensal', bimestral:'Bimestral',
                       trimestral:'Trimestral', semestral:'Semestral', anual:'Anual' };

function fmtMetaVal(v, indicador) {
  if (indicador === 'faturamento') return fmtBRL(v);
  return v + (v === 1 ? ' contrato' : ' contratos');
}

function renderMetaCard(m, membros) {
  const pct3 = Math.min(100, Math.round((m.progresso_atual / m.meta_3) * 100));
  // posição dos marcos na barra
  const pos1 = Math.round((m.meta_1 / m.meta_3) * 100);
  const pos2 = Math.round((m.meta_2 / m.meta_3) * 100);

  const fillClass = m.nivel_atingido === 3 ? 'nivel-3' : m.nivel_atingido === 2 ? 'nivel-2' : m.nivel_atingido === 1 ? 'nivel-1' : '';

  const diasRestantes = Math.max(0, Math.ceil((new Date(m.data_fim) - new Date()) / 86400000));
  const expirou       = diasRestantes === 0 && new Date(m.data_fim) < new Date();

  const teamRows = membros?.length ? membros.map(u => {
    const pctU = Math.min(100, Math.round((u.progresso_atual / m.meta_3) * 100));
    return `<div class="meta-team-row">
      ${u.avatar_url
        ? `<img src="${u.avatar_url}" class="meta-team-av" style="object-fit:cover" />`
        : `<div class="meta-team-av">${inicial(u.name)}</div>`}
      <span class="meta-team-name">${u.name.split(' ')[0]}</span>
      <div class="meta-team-bar-bg"><div class="meta-team-bar-fill n${u.nivel_atingido}" style="width:${pctU}%"></div></div>
      <span class="meta-team-val">${fmtMetaVal(u.progresso_atual, m.indicador)}</span>
    </div>`;
  }).join('') : '';

  const editBtns = userRole === 'gestor' ? `
    <div style="display:flex;gap:6px;margin-top:12px">
      <button class="btn-editar-meta" onclick="editarMeta('${m.id}')">✏️ Editar</button>
      <button class="btn-excluir-meta" onclick="excluirMeta('${m.id}')">🗑️ Excluir</button>
    </div>` : '';

  return `<div class="meta-card nivel-${m.nivel_atingido}">
    <div class="meta-header">
      <div>
        <div class="meta-titulo">${m.titulo}</div>
        <div class="meta-indicador">${m.indicador === 'faturamento' ? '💰 Faturamento' : '📋 Contratos'} · ${expirou ? '<span style="color:var(--red)">Encerrada</span>' : diasRestantes + ' dias restantes'}</div>
      </div>
      <span class="meta-periodo-badge">${PERIODO_PT[m.periodo]||m.periodo}</span>
    </div>

    <div class="meta-atual-row">
      <div class="meta-atual-num">${m.indicador === 'faturamento' ? fmtBRL(m.progresso_atual) : m.progresso_atual}</div>
      <div class="meta-atual-unit">${m.indicador === 'contratos' ? 'contratos' : ''}</div>
    </div>
    <div class="meta-nivel-badge n${m.nivel_atingido}">${NIVEL_ICONS[m.nivel_atingido]} ${NIVEL_LABELS[m.nivel_atingido]}</div>

    <div class="meta-progress-wrap" style="margin-top:16px">
      <div class="meta-bar-bg">
        <div class="meta-bar-fill ${fillClass}" style="width:${pct3}%"></div>
        <div class="meta-marker m1 ${m.nivel_atingido>=1?'atingida':''}" style="left:${pos1}%" title="Meta 1: ${fmtMetaVal(m.meta_1,m.indicador)}">🥉</div>
        <div class="meta-marker m2 ${m.nivel_atingido>=2?'atingida':''}" style="left:${pos2}%" title="Meta 2: ${fmtMetaVal(m.meta_2,m.indicador)}">🥈</div>
        <div class="meta-marker m3 ${m.nivel_atingido>=3?'atingida':''}" style="left:98%" title="Meta 3: ${fmtMetaVal(m.meta_3,m.indicador)}">🥇</div>
      </div>
    </div>
    <div class="meta-labels">
      <div class="meta-label ${m.nivel_atingido>=1?'atingida':''}">
        <div class="lbl-icon">🥉</div>
        <div class="lbl-val">${fmtMetaVal(m.meta_1, m.indicador)}</div>
        <div class="lbl-txt">Bronze</div>
      </div>
      <div class="meta-label ${m.nivel_atingido>=2?'atingida':''}">
        <div class="lbl-icon">🥈</div>
        <div class="lbl-val">${fmtMetaVal(m.meta_2, m.indicador)}</div>
        <div class="lbl-txt">Prata</div>
      </div>
      <div class="meta-label ${m.nivel_atingido>=3?'atingida':''}">
        <div class="lbl-icon">🥇</div>
        <div class="lbl-val">${fmtMetaVal(m.meta_3, m.indicador)}</div>
        <div class="lbl-txt">Ouro</div>
      </div>
    </div>

    ${teamRows ? `<div style="margin-top:14px">${teamRows}</div>` : ''}
    ${editBtns}
  </div>`;
}

function renderMetas() {
  const isGestor  = userRole === 'gestor';
  const metasData = isGestor ? (dadosMetasGestor?.metas || []) : (dadosMetas?.metas || []);
  const novaBtnHtml = isGestor
    ? `<button class="btn-nova-meta" onclick="abrirModalMeta()">+ Nova meta</button>`
    : '';

  if (!metasData.length) return `
    ${novaBtnHtml}
    <div class="empty-state">
      <div class="empty-icon">🎯</div>
      <p>${isGestor ? 'Nenhuma meta criada ainda. Crie a primeira meta para a sua equipe!' : 'Nenhuma meta definida para você ainda.'}</p>
    </div>`;

  const cards = metasData.map(m => renderMetaCard(m, isGestor ? m.membros : null)).join('');
  return `${novaBtnHtml}<div class="metas-grid">${cards}</div>`;
}

// ── Modal de Metas ─────────────────────────────────────────────────────────────
function abrirModalMeta(meta = null) {
  document.getElementById('meta-edit-id').value       = meta?.id || '';
  document.getElementById('meta-modal-titulo').textContent = meta ? '✏️ Editar Meta' : '🎯 Nova Meta';
  document.getElementById('meta-titulo').value        = meta?.titulo || '';
  document.getElementById('meta-indicador').value     = meta?.indicador || 'contratos';
  document.getElementById('meta-periodo').value       = meta?.periodo || 'mensal';
  document.getElementById('meta-data-inicio').value   = meta?.data_inicio || new Date().toISOString().slice(0,10);
  document.getElementById('meta-m1').value            = meta?.meta_1 || '';
  document.getElementById('meta-m2').value            = meta?.meta_2 || '';
  document.getElementById('meta-m3').value            = meta?.meta_3 || '';

  // Popula lista de membros
  const lista = document.getElementById('meta-usuarios-list');
  if (membrosCache.length) {
    const selecionados = meta?.user_ids || [];
    lista.innerHTML = membrosCache.map(m => `
      <label class="meta-checkbox-item">
        <input type="checkbox" value="${m.id}" ${selecionados.includes(m.id)?'checked':''} />
        <span>${m.name}</span>
      </label>`).join('');
  } else {
    lista.innerHTML = '<div style="color:rgba(200,190,255,.3);font-size:12px;padding:8px">Carregue a página novamente para ver os membros</div>';
  }

  document.getElementById('meta-modal').classList.add('active');
}

function fecharModalMeta() {
  document.getElementById('meta-modal').classList.remove('active');
}

async function salvarMeta() {
  const id       = document.getElementById('meta-edit-id').value;
  const titulo   = document.getElementById('meta-titulo').value.trim();
  const m1       = document.getElementById('meta-m1').value;
  const m2       = document.getElementById('meta-m2').value;
  const m3       = document.getElementById('meta-m3').value;

  if (!titulo)      { alert('Informe o título.'); return; }
  if (!m1||!m2||!m3){ alert('Preencha as 3 metas.'); return; }

  const checkboxes = document.querySelectorAll('#meta-usuarios-list input[type=checkbox]:checked');
  const user_ids   = Array.from(checkboxes).map(c => c.value);

  const body = {
    titulo,
    indicador:   document.getElementById('meta-indicador').value,
    periodo:     document.getElementById('meta-periodo').value,
    data_inicio: document.getElementById('meta-data-inicio').value,
    meta_1: parseFloat(m1), meta_2: parseFloat(m2), meta_3: parseFloat(m3),
    user_ids: user_ids.length ? user_ids : [],
  };

  const url    = id ? `/api/metas/${id}` : '/api/metas';
  const method = id ? 'PUT' : 'POST';

  const r = await apiFetch(url, { method, body: JSON.stringify(body) });
  if (!r.ok) { alert('Erro ao salvar meta.'); return; }

  fecharModalMeta();
  await carregarDados();
  // Volta pra aba de metas
  document.querySelectorAll('.tab-btn').forEach(b => { if (b.textContent.includes('Metas')) b.click(); });
}

async function excluirMeta(id) {
  if (!confirm('Excluir esta meta?')) return;
  const r = await apiFetch(`/api/metas/${id}`, { method: 'DELETE' });
  if (!r.ok) { alert('Erro ao excluir.'); return; }
  await carregarDados();
}

function editarMeta(id) {
  const metas = dadosMetasGestor?.metas || [];
  const meta  = metas.find(m => m.id === id);
  if (meta) abrirModalMeta(meta);
}
</script>
